name: Release

# Push a tag like v0.1.0, or run this workflow by hand from the Actions tab
# ("Run workflow" and type the tag). Either way GitHub builds, zips and
# publishes the release — no local build and no personal access token needed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release, e.g. v0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version is read from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test

      # Builds dist/ and writes auto-group.zip at the repo root.
      - run: pnpm zip

      # A hand-written .github/release-notes/<tag>.md wins; otherwise GitHub
      # generates the notes from the commits in the release.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" auto-group.zip --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" auto-group.zip --title "$TAG" --generate-notes
          fi
